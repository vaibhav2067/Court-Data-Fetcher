<!DOCTYPE html>
<html>
<head>
    <title>Case Result</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 600px;
            margin: auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .title {
            font-size: 22px;
            font-weight: bold;
        }
        .row {
            margin-top: 10px;
            font-size: 16px;
        }
        .label {
            font-weight: bold;
        }
        .links a {
            margin-right: 15px;
        }
        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 12px;
            background: #1976d2;
            color: white;
            border-radius: 5px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="card">
    
    <div class="title">{{ data.case_no }}</div>

    <div class="row"><span class="label">Status:</span> {{ data.status }}</div>
    <div class="row"><span class="label">Petitioner:</span> {{ data.petitioner }}</div>
    <div class="row"><span class="label">Respondent:</span> {{ data.respondent }}</div>

    <div class="row"><span class="label">Next Date:</span> {{ data.next_date }}</div>
    <div class="row"><span class="label">Last Date:</span> {{ data.last_date }}</div>
    <div class="row"><span class="label">Court No:</span> {{ data.court_no }}</div>

    <div class="row links">
        <span class="label">Documents:</span><br>
        <a href="{{ data.orders_link }}" target="_blank">Orders</a>
        <a href="{{ data.judgment_link }}" target="_blank">Judgment</a>
    </div>

</div>

<a href="/" class="btn-back">Back</a>

</body>
</html>

<!DOCTYPE html>
<html>
<head><title>Delhi High Court Case Fetcher</title></head>
<body>
    <h1>Delhi High Court Case Status</h1>
    <p><strong>Browser Status:</strong> Running</p>
    <form action="/submit" method="POST">
        <label>Case Type:</label>
        <input type="text" name="case_type" required><br>
        
        <label>Case Number:</label>
        <input type="text" name="case_number" required><br>
        
        <label>Case Year:</label>
        <input type="text" name="case_year" required><br>
        
        <p><strong>Captcha Shown:</strong> {{ captcha }}</p>
        <label>Enter Captcha:</label>
        <input type="text" name="captcha_entered" required><br>
        
        <button type="submit">Submit</button>
    </form>
</body>
</html>
